<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멍석</title>
<meta name="description" content="한강 둔치에 멍석 깔아뒀어요. 다른 사람들과 나란히 앉아 아무것도 하지 않는 시간을 재요.">
<meta property="og:title" content="멍석">
<meta property="og:description" content="한강 둔치에 멍석 깔아뒀어요. 앉아서 아무것도 하지 마세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='14' rx='2' fill='%23c9a66b'/%3E%3Ccircle cx='16' cy='8' r='5' fill='%2315151a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600&family=IBM+Plex+Mono&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #19223a;
    --dusk: #3a4766;
    --water: #141d31;
    --bank: #1f2a24;
    --lamp: #f2c14e;
    --straw: #c9a66b;
    --straw-dark: #a88447;
    --ink: #ece5d3;
    --muted: #8c94a8;
    --panel: rgba(15, 22, 38, .92);
    --display: 'Hahmlet', serif;
    --body: 'IBM Plex Sans KR', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font: 400 15px/1.6 var(--body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

  /* ---------- 장면 ---------- */
  .scene { position: fixed; inset: 0; }
  .sky { position: absolute; inset: 0 0 52% 0; background: linear-gradient(var(--night), var(--dusk)); }
  .skyline { position: absolute; left: 0; right: 0; bottom: 52%; width: 100%; height: 16vh; display: block; }
  .bridge { position: absolute; left: 0; right: 0; bottom: calc(52% - 2.2vh); width: 100%; height: 4.4vh; display: block; }
  .river { position: absolute; inset: 48% 0 34% 0; background: var(--water); overflow: hidden; }
  .glint {
    position: absolute; top: 4%; width: 3px; height: 70%;
    background: linear-gradient(rgba(242, 193, 78, .55), rgba(242, 193, 78, 0));
    filter: blur(1px);
    animation: glint 6s ease-in-out infinite alternate;
  }
  @keyframes glint { from { opacity: .25; transform: scaleX(1); } to { opacity: .8; transform: scaleX(2.2); } }
  .bank { position: absolute; inset: 66% 0 0 0; background: var(--bank); }
  .bank::before { /* 강변 산책로 */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #2d3a33;
  }

  /* ---------- 사람과 멍석 (뒷모습) ---------- */
  .person {
    position: absolute;
    left: var(--x); bottom: var(--y);
    width: calc(clamp(30px, 5.6vw, 64px) * var(--s));
    aspect-ratio: 1 / 1.15;
    transform: translateX(-50%);
    z-index: var(--z);
    transition: opacity .8s, transform .8s;
  }
  .person.leaving { opacity: 0; transform: translateX(-50%) translateY(-30%); }
  .mat {
    position: absolute; left: -35%; right: -35%; bottom: 0; height: 26%;
    background:
      repeating-linear-gradient(90deg, transparent 0 3px, rgba(0, 0, 0, .16) 3px 4px),
      repeating-linear-gradient(0deg, var(--straw) 0 2px, var(--straw-dark) 2px 3px);
    transform: perspective(60px) rotateX(38deg);
    border-radius: 2px;
  }
  .body {
    position: absolute; left: 8%; right: 8%; bottom: 10%; height: 58%;
    background: var(--jacket);
    border-radius: 46% 46% 12% 12% / 60% 60% 10% 10%;
    transform-origin: bottom;
    animation: breathe 5.5s ease-in-out infinite;
    animation-delay: var(--d);
  }
  .head {
    position: absolute; left: 50%; bottom: 58%; width: 44%; aspect-ratio: 1;
    transform: translateX(-50%);
    background: #15151a; border-radius: 50%;
    animation: breathe 5.5s ease-in-out infinite;
    animation-delay: var(--d);
  }
  @keyframes breathe { 50% { translate: 0 -1.5%; } }
  .tag {
    position: absolute; left: 50%; bottom: -34%; transform: translateX(-50%);
    font-size: 11px; color: var(--muted); white-space: nowrap;
    max-width: 9em; overflow: hidden; text-overflow: ellipsis;
  }
  .person.me .tag { color: var(--lamp); }

  /* ---------- 패널 ---------- */
  .panel { /* 비어 있는 하늘에 띄운다: 둔치의 사람들을 가리지 않게 */
    position: fixed; top: clamp(16px, 9vh, 96px); left: clamp(16px, 6vw, 88px);
    width: min(420px, calc(100% - 32px));
    padding: 22px 22px 20px;
    background: var(--panel);
    border: 1px solid rgba(236, 229, 211, .08);
    border-radius: 6px;
    transition: opacity .6s;
  }
  .panel[hidden] { display: none; }
  .wordmark { font: 600 34px/1 var(--display); letter-spacing: -.01em; }
  .wordmark span { color: var(--straw); }
  .lead { margin-top: 10px; }
  .rule { margin-top: 6px; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; margin-top: 18px; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  input {
    flex: 1; min-width: 0; padding: 11px 12px;
    background: rgba(0, 0, 0, .25); border: 1px solid rgba(236, 229, 211, .16); border-radius: 4px;
  }
  input::placeholder { color: var(--muted); }
  .btn {
    padding: 11px 16px; border: 0; border-radius: 4px; cursor: pointer;
    background: var(--straw); color: #1b1608; font-weight: 500; white-space: nowrap;
  }
  .btn:hover { background: #d6b57d; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(236, 229, 211, .2); }
  .btn.ghost:hover { background: rgba(236, 229, 211, .06); }
  .row { display: flex; gap: 8px; margin-top: 18px; }
  .count-num { font: 600 56px/1 var(--display); color: var(--lamp); margin-top: 6px; }
  .result-time { font: 600 30px/1.2 var(--display); margin-top: 6px; }
  .result-rank { margin-top: 4px; color: var(--muted); }
  .result-rank strong { color: var(--lamp); font-weight: 500; }
  .here { margin-top: 14px; font-size: 12px; color: var(--muted); }

  /* ---------- 순위 ---------- */
  .board {
    position: fixed; top: 16px; right: 16px; width: 220px;
    padding: 14px 16px; background: var(--panel); border-radius: 6px;
    font-size: 13px; transition: opacity .6s;
  }
  .board h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
  .board ol { list-style: none; padding: 0; counter-reset: r; }
  .board li { display: flex; gap: 8px; padding: 3px 0; counter-increment: r; }
  .board li::before { content: counter(r); width: 1.4em; color: var(--muted); font-family: var(--mono); }
  .board .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .s { font-family: var(--mono); color: var(--straw); }
  .board .empty { color: var(--muted); }
  .board .empty::before { content: none; }

  /* ---------- 앉아 있는 동안: 화면이 나를 내버려 둔다 ---------- */
  .clock {
    position: fixed; left: 50%; top: 18vh; transform: translateX(-50%);
    font: 400 15px var(--mono); color: var(--ink); opacity: 0; transition: opacity 2s;
    pointer-events: none;
  }
  body.sitting { cursor: none; }
  body.sitting .board { opacity: 0; pointer-events: none; }
  body.sitting .clock { opacity: .5; }

  @media (max-width: 640px) {
    .board { left: 16px; right: 16px; width: auto; }
    .panel { top: 112px; left: 16px; }
    .person:not(.me) .tag { display: none; }  /* 좁은 화면에선 이름표가 겹친다: 내 것만 */
    .board li:not(:first-child) { display: none; }  /* 좁은 화면: 1등만, 누르면 펼친다 */
    .board.open li:not(:first-child) { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="sky"></div>
  <svg class="skyline" id="skyline" viewBox="0 0 1000 120" preserveAspectRatio="none"></svg>
  <div class="river" id="river"></div>
  <svg class="bridge" id="bridge" viewBox="0 0 1000 40" preserveAspectRatio="none"></svg>
  <div class="bank" id="bank"></div>
</div>

<aside class="board" id="board">
  <h2>오늘 오래 앉은 사람</h2>
  <ol id="boardList"></ol>
</aside>

<section class="panel" id="intro">
  <h1 class="wordmark">멍<span>석</span></h1>
  <p class="lead">한강 둔치에 멍석 깔아뒀어요. 앉아서 아무것도 하지 마세요.</p>
  <p class="rule">마우스, 키보드, 화면을 건드리거나 다른 탭으로 가면 일어난 걸로 쳐요.</p>
  <form id="sitForm">
    <label for="name">이름</label>
    <input id="name" maxlength="12" placeholder="둔치에서 불릴 이름" autocomplete="nickname">
    <button class="btn" type="submit">멍석에 앉기</button>
  </form>
  <p class="here" id="here"></p>
</section>

<section class="panel" id="count" hidden>
  <p>손 떼세요</p>
  <p class="count-num" id="countNum">3</p>
</section>

<section class="panel" id="out" hidden>
  <p>일어났어요</p>
  <p class="result-time" id="outTime"></p>
  <p class="result-rank" id="outRank"></p>
  <div class="row">
    <button class="btn" id="again" type="button">다시 앉기</button>
    <button class="btn ghost" id="share" type="button">기록 공유하기</button>
  </div>
</section>

<section class="panel" id="lost" hidden>
  <p>연결이 끊겼어요. 앉아 있던 시간은 기록되지 않았어요.</p>
  <div class="row"><button class="btn" type="button" onclick="location.reload()">다시 연결하기</button></div>
</section>

<p class="clock" id="clock">0:00</p>
<p id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></p>

<script>
const $ = id => document.getElementById(id);
const JACKETS = ['#6f8faf', '#b5651d', '#7a9e7e', '#c98b9e', '#d9c27e', '#5e6472', '#9b6b5a'];
const COL_ORDER = [4, 5, 3, 6, 2, 7, 1, 8, 0, 9];       // 앞줄 가운데부터 채운다
const ROWS = [{ y: 16, s: 1 }, { y: 46, s: .82 }, { y: 70, s: .66 }];

// ---------- 장면 그리기 ----------
(function drawScene() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const ns = 'http://www.w3.org/2000/svg';
  const sky = $('skyline');
  for (let x = 0; x < 1000;) {
    const w = 18 + rnd() * 34, h = 25 + rnd() * 70;
    const b = document.createElementNS(ns, 'rect');
    Object.entries({ x, y: 120 - h, width: w, height: h, fill: '#11182a' }).forEach(([k, v]) => b.setAttribute(k, v));
    sky.append(b);
    for (let wy = 120 - h + 6; wy < 116; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) {
      if (rnd() > .9) {
        const win = document.createElementNS(ns, 'rect');
        Object.entries({ x: wx, y: wy, width: 2.5, height: 3, fill: '#f2c14e', opacity: .35 + rnd() * .4 }).forEach(([k, v]) => win.setAttribute(k, v));
        sky.append(win);
      }
    }
    x += w + 2;
  }
  // 산 위의 탑
  sky.insertAdjacentHTML('beforeend',
    '<path d="M700 120 Q740 70 790 120Z" fill="#141c30"/><rect x="742" y="40" width="4" height="56" fill="#141c30"/>' +
    '<rect x="736" y="52" width="16" height="6" fill="#141c30"/><circle cx="744" cy="38" r="2" fill="#f2c14e"/>');

  const br = $('bridge');
  let d = '<rect x="0" y="16" width="1000" height="5" fill="#0d1322"/>';
  for (let x = 40; x < 1000; x += 80) d += `<path d="M${x - 40} 21 Q${x} 38 ${x + 40} 21" stroke="#0d1322" stroke-width="3" fill="none"/>`;
  for (let x = 20; x < 1000; x += 40) d += `<circle cx="${x}" cy="14" r="1.6" fill="#f2c14e"/>`;
  br.innerHTML = d;
  for (let x = 2; x < 100; x += 4) {
    const g = document.createElement('span');
    g.className = 'glint';
    g.style.left = x + '%';
    g.style.animationDelay = (-rnd() * 6).toFixed(2) + 's';
    $('river').append(g);
  }
})();

// ---------- 사람 ----------
const people = new Map();
let myId = null;

function place(p) {
  const row = ROWS[Math.floor(p.seat / 10) % ROWS.length];
  const col = COL_ORDER[p.seat % 10];
  const el = document.createElement('div');
  el.className = 'person' + (p.id === myId ? ' me' : '');
  const h = [...p.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  el.style.cssText = `--x:${6 + col * 9.8 + (Math.floor(p.seat / 10) % 2) * 4}%;--y:${row.y}%;--s:${row.s};--z:${10 - Math.floor(p.seat / 10)};--jacket:${JACKETS[h % JACKETS.length]};--d:${-(h % 55) / 10}s`;
  el.innerHTML = '<span class="mat"></span><span class="body"></span><span class="head"></span><span class="tag"></span>';
  el.querySelector('.tag').textContent = p.id === myId ? '나' : p.name;
  people.get(p.id)?.remove();
  people.set(p.id, el);
  $('bank').append(el);
  updateHere();
}
function unplace(id) {
  const el = people.get(id);
  if (!el) return;
  people.delete(id);
  el.classList.add('leaving');
  setTimeout(() => el.remove(), 800);
  updateHere();
}
function updateHere() {
  $('here').textContent = people.size ? `이 둔치에 ${people.size}명 앉아 있어요` : '지금은 둔치가 비어 있어요. 먼저 앉아 보세요.';
}

// ---------- 시간 표시 ----------
const clock = s => `${s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') : Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const korean = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
  return [h && `${h}시간`, m && `${m}분`, (!h && (sec || !m)) && `${sec}초`].filter(Boolean).join(' ');
};

// ---------- 화면 상태 ----------
function show(id) {
  for (const p of ['intro', 'count', 'out', 'lost']) $(p).hidden = p !== id;
  document.body.classList.toggle('sitting', id === null);
}

// ---------- 연결 ----------
const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
const send = m => ws.readyState === 1 && ws.send(JSON.stringify(m));
let minRecord = 10, lastResult = null;

ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') { myId = m.you; minRecord = m.minRecord; m.peers.forEach(place); updateHere(); }
  else if (m.t === 'sit') { place(m.peer); if (m.peer.id === myId) startSitting(); }
  else if (m.t === 'up' || m.t === 'leave') unplace(m.id);
  else if (m.t === 'board') renderBoard(m.list);
  else if (m.t === 'out') showResult(m.secs, m.rank);
};
ws.onclose = () => { stopWatching(); show('lost'); };

function renderBoard(list) {
  const ol = $('boardList');
  ol.replaceChildren();
  if (!list.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 아무도 없어요. 첫 기록을 남겨 보세요.';
    return ol.append(li);
  }
  for (const r of list) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="n"></span><span class="s"></span>';
    li.querySelector('.n').textContent = r.name;
    li.querySelector('.s').textContent = clock(r.secs);
    ol.append(li);
  }
}
$('board').addEventListener('click', () => $('board').classList.toggle('open'));

// ---------- 앉기 ----------
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }

$('sitForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('name').value.trim();
  try { localStorage.setItem('mungseok-name', name); } catch {}
  countdown(name);
});
$('again').addEventListener('click', () => countdown($('name').value.trim()));

function countdown(name) {
  show('count');
  keepAwake();
  let n = 3;
  $('countNum').textContent = n;
  $('live').textContent = '3초 뒤에 앉아요. 손을 떼세요.';
  const t = setInterval(() => {
    if (--n > 0) return void ($('countNum').textContent = n);
    clearInterval(t);
    document.activeElement?.blur();
    send({ t: 'sit', name });
  }, 1000);
}

// ---------- 앉아 있는 동안 ----------
const EVENTS = ['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart', 'blur'];
let started = 0, tick = null;

function trip(e) {
  if (e.type === 'mousemove' && !e.movementX && !e.movementY) return; // 화면이 바뀔 때 생기는 가짜 움직임
  if (e.type === 'visibilitychange' && !document.hidden) return;
  stopWatching();
  send({ t: 'up' });
}
function startSitting() {
  show(null);
  $('live').textContent = '앉았어요. 이제 아무것도 하지 마세요.';
  started = performance.now();
  $('clock').textContent = '0:00';
  tick = setInterval(() => { $('clock').textContent = clock(Math.floor((performance.now() - started) / 1000)); }, 1000);
  EVENTS.forEach(ev => window.addEventListener(ev, trip, { passive: true }));
  document.addEventListener('visibilitychange', trip);
}
function stopWatching() {
  clearInterval(tick);
  EVENTS.forEach(ev => window.removeEventListener(ev, trip));
  document.removeEventListener('visibilitychange', trip);
  lock?.release().catch(() => {});
  lock = null;
}

function showResult(secs, rank) {
  lastResult = { secs, rank };
  $('outTime').textContent = `${korean(secs)} 앉아 있었어요`;
  const r = $('outRank');
  if (rank) r.innerHTML = `오늘 <strong></strong>예요.`, r.querySelector('strong').textContent = `${rank}등`;
  else r.textContent = secs < minRecord ? `순위에는 ${minRecord}초 넘게 앉아야 올라가요.` : '오늘 10등 안에는 못 들었어요.';
  show('out');
  $('live').textContent = $('outTime').textContent;
}

$('share').addEventListener('click', async () => {
  if (!lastResult) return;
  const text = `멍석에서 ${korean(lastResult.secs)} 동안 아무것도 안 했어요${lastResult.rank ? ` (오늘 ${lastResult.rank}등)` : ''}`;
  try {
    if (navigator.share) await navigator.share({ text, url: location.origin });
    else { await navigator.clipboard.writeText(`${text} ${location.origin}`); $('share').textContent = '복사했어요'; }
  } catch {}
});

try { $('name').value = localStorage.getItem('mungseok-name') || ''; } catch {}
updateHere();
</script>
</body>
</html>
